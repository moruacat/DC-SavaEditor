<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost https://api.github.com" />
  <title>恶魔连结 存档编辑器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部工具栏 -->
  <header id="toolbar">
    <button id="btn-open" class="btn primary">打开存档文件夹…</button>
    <button id="btn-refresh" class="btn">刷新</button>
    <span id="path-label" class="path-label" title=""></span>
    <div class="spacer"></div>
    <button id="btn-resource" class="btn">资源目录</button>
    <span id="res-label" class="path-label small"></span>
    <span class="spacer"></span>
    <button id="btn-backup" class="btn" title="备份整个存档文件夹到 backup/">🗜 备份</button>
    <button id="btn-restore" class="btn" title="从 backup/ 还原存档">↩ 还原</button>
    <button id="btn-export" class="btn" title="解码并导出当前系统存档为明文 JSON">⬇ 导出</button>
    <button id="btn-import" class="btn" title="导入明文 JSON 并载入系统存档">⬆ 导入</button>
    <button id="btn-theme" class="btn" title="切换深色/浅色模式">🌙 深色</button>
    <button id="btn-anim" class="btn" title="切换界面动画（回弹/弹跳/平滑过渡）">🎬 动画</button>
    <select id="lang-sel" class="lang-select" title="界面语言（检测到 lang_*.json 时可用）" style="display:none"></select>
    <button id="btn-update" class="btn" title="检查 GitHub 最新版本">🔁 检查更新</button>
    <button id="btn-save" class="btn primary" disabled>保存</button>
  </header>

  <div id="main">
    <!-- 左侧：存档列表 -->
    <aside id="sidebar">
      <div id="file-list" class="file-list"></div>
    </aside>

    <!-- 右侧：内容面板 -->
    <section id="content">
      <div id="empty-hint" class="empty-hint">
        <h2>恶魔连结 存档编辑器</h2>
        <p>点击「打开存档文件夹」，默认读取游戏存档目录 <code>_storage</code></p>
        <p>支持：系统存档 / 槽位存档(动态扩容，最多600) / 快速·自动存档 / 游戏照片预览与导出</p>
      </div>
      <div id="panels" style="display:none">
        <!-- 照片面板 -->
        <div id="panel-photo" class="panel">
          <div class="panel-head">
            <h3>游戏照片</h3>
            <span id="photo-count" class="count"></span>
          </div>
          <div id="photo-grid" class="grid"></div>
        </div>

        <!-- 系统存档面板 -->
        <div id="panel-system" class="panel">
          <div class="tabs">
            <button class="tab active" data-tab="overview">概览</button>
            <button class="tab" data-tab="endings">结局</button>
            <button class="tab" data-tab="stickers">贴纸</button>
            <button class="tab" data-tab="vars">变量</button>
            <button class="tab" data-tab="json">JSON</button>
          </div>
          <div id="sys-overview" class="tabpage active">
            <div id="name-hint" class="hint"></div>
            <div id="overview-progress" class="progress-row"></div>
            <div class="form-grid" id="sf-fields"></div>
            <h4>判定统计 (judgeCounts)</h4>
            <div class="form-grid" id="judge-fields"></div>
            <h4>其它集合（逗号分隔）</h4>
            <div id="list-fields" class="form-grid"></div>
          </div>
          <div id="sys-endings" class="tabpage">
            <div class="legend">
              <label><input type="checkbox" id="end-unlock-all"> 全部解锁 endings</label>
              <label><input type="checkbox" id="end-collect-all"> 全部收集 collectedEndings</label>
            </div>
            <div class="end-grid" id="end-grid"></div>
          </div>
          <div id="sys-stickers" class="tabpage">
            <div class="legend">
              <label><input type="checkbox" id="stick-all"> 全部解锁贴纸</label>
            </div>
            <div class="stick-grid" id="stick-grid"></div>
          </div>
          <div id="sys-vars" class="tabpage">
            <input id="var-search" class="search-input" placeholder="🔍 搜索变量（名称 / 说明）…" />
            <div id="var-table" class="var-table"></div>
          </div>
          <div id="sys-json" class="tabpage">
            <input id="json-search" class="search-input" placeholder="🔍 在 JSON 中查找（Enter 跳到下一个）…" />
            <textarea id="json-editor" spellcheck="false"></textarea>
          </div>
        </div>

        <!-- 槽位存档面板 -->
        <div id="panel-slots" class="panel">
          <div id="slot-hint" class="hint"></div>
          <input id="slot-search" class="search-input" placeholder="🔍 搜索槽位（标题 / 文本）…" />
          <div class="slot-layout">
            <div class="slot-grid" id="slot-grid"></div>
            <div id="slot-detail" class="slot-detail">
              <div class="form-grid" id="slot-meta"></div>
              <h4>stat.f 变量</h4>
              <input id="slot-var-search" class="search-input small" placeholder="🔍 搜索变量…" />
              <div id="slot-vars" class="var-table"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer id="statusbar">就绪</footer>
  <div id="toast" class="toast hidden"></div>

  <!-- 照片大图模态 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-bar">
        <span id="modal-title"></span>
        <button id="modal-export" class="btn primary">导出图片</button>
        <button id="modal-close" class="btn">关闭</button>
      </div>
      <div class="modal-body"><img id="modal-img" alt="" /></div>
    </div>
  </div>

  <!-- 还原备份模态 -->
  <div id="restore-modal" class="modal hidden">
    <div class="modal-box" style="width:420px;max-width:92vw">
      <div class="modal-bar"><span>从备份还原</span><button id="restore-close" class="btn">关闭</button></div>
      <div class="modal-body"><div id="restore-list"></div></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="data.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
